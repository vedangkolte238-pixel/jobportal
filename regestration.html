<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal Registration</title>
    <link rel="stylesheet" href="regestration.css">
</head>

<body>

    <div class="container">

        <div class="left">
            <h1>Job Portal</h1>
            <p>Find your dream job with one click.</p>
        </div>

        <div class="right">

            <form id="registerForm" enctype="multipart/form-data">

                <h2>Create Account</h2>

                <input type="text" id="name" placeholder="Full Name" required>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="tel" id="phone" placeholder="Phone Number" required>

                <input type="date" id="dob" required>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <input type="text" id="qualification" placeholder="Qualification" required>

                <input type="text" id="skills" placeholder="Skills (Java, HTML, CSS)" required>

                <input type="file" id="resume" accept=".pdf,.doc,.docx" required>

                <input type="password" id="password" placeholder="Password" required>

                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                <label class="terms">
                    <input type="checkbox" id="terms">
                    I agree to Terms & Conditions
                </label>

                <button type="submit">Register</button>

                <p id="message"></p>

                <div class="login">

                    <p>
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                    <p class="admin-login">
                        <span>Are you an Admin?</span>
                        <a href="admin_login.html">Admin Login</a>
                    </p>

                </div>
            </form>

        </div>

    </div>

    <script src="regestration.js"></script>

</body>

</html>
