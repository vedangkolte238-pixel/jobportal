<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <div class="left">
        <h1>Job Portal</h1>
        <p>Welcome Back!</p>
        <span>Login to continue your career journey.</span>
    </div>

    <div class="right">

        <form id="loginForm">

            <h2>Login</h2>

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

            <p id="message"></p>

            <p class="register">
                Don't have an account?
                <a href="regestration.html">Register</a>
            </p>

        </form>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
